name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # --- Build Angular ---
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Angular dependencies
        run: npm install
        working-directory: ./frontend
      - name: Build Angular
        run: npm run build --prod
        working-directory: ./frontend

      # --- Build Spring Boot ---
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: Build Spring Boot
        run: ./mvnw clean package -DskipTests
        working-directory: ./backend

      # --- Docker Build & Push ---
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker images
        run: |
          docker build -t myrepo/barbershop-frontend:latest ./frontend/dist
          docker build -t myrepo/barbershop-backend:latest ./backend/target

      - name: Push Docker images
        run: |
          docker push myrepo/barbershop-frontend:latest
          docker push myrepo/barbershop-backend:latest

      # --- SSH Deploy na VM ---
      - name: Deploy on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker pull myrepo/barbershop-frontend:latest
            docker pull myrepo/barbershop-backend:latest
            docker compose -f /home/deploy/barbershop/docker-compose.yml up -d --build
